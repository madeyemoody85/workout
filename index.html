<!DOCTYPE html>
<html lang="en" style="background-color:#0c0c0c !important;">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>My Routine</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{background:#0c0c0c !important;color:#f5f5f5;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;min-height:100vh;font-size:15px;line-height:1.5;-webkit-tap-highlight-color:transparent;-webkit-font-smoothing:antialiased}
.app{background:#0c0c0c;min-height:100vh;padding-bottom:40px}
.hdr{padding:24px 20px 16px;border-bottom:1px solid #2a2a2a}
.hdr h1{font-size:24px;font-weight:700;color:#fff}.hdr .tg{font-size:12px;color:#b0b0b0;margin-top:2px}.hdr .sb{font-size:14px;color:#d4d4d4;margin-top:6px}
.sync-bar{padding:6px 20px;font-size:11px;font-weight:600;text-align:center}
.sync-bar.loading{background:#1a2a1a;color:#4ade80}.sync-bar.error{background:#2a1a1a;color:#ef4444}
.sync-bar.ok{background:#0c0c0c;height:0;padding:0;overflow:hidden}
.mbar{display:flex;padding:10px 16px;border-bottom:1px solid #2a2a2a}
.mbtn{flex:1;padding:10px 6px;border:1px solid #2a2a2a;background:transparent;color:#b0b0b0;font-size:12px;font-weight:600;text-transform:uppercase;cursor:pointer;font-family:inherit;letter-spacing:.3px}
.mbtn:first-child{border-radius:8px 0 0 8px}.mbtn:last-child{border-radius:0 8px 8px 0}
.mbtn.on{background:#1e1e1e;color:#fff;border-color:#444}
.pkr{padding:16px 20px;border-bottom:1px solid #2a2a2a}
.pkr-l{font-size:13px;color:#d4d4d4;font-weight:600;text-transform:uppercase;letter-spacing:.5px;margin-bottom:12px}
.pkr-g{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pkc{padding:12px 14px;border-radius:10px;border:1px solid #2a2a2a;background:#171717;cursor:pointer;text-align:left;position:relative;color:#f5f5f5}
.pkc:active{transform:scale(.98)}.pkc.on{background:#1f1610}
.pkc .pn{font-size:14px;font-weight:600;color:#fff;margin-bottom:2px}.pkc .pf{font-size:12px;color:#b0b0b0}
.pkc .pd{position:absolute;top:12px;right:12px;width:8px;height:8px;border-radius:50%}
.pkc .nx{margin-top:4px;font-size:10px;font-weight:700;color:#fbbf24;text-transform:uppercase}
.dhdr{padding:16px 20px 12px;border-bottom:1px solid #2a2a2a}
.dhdr-r{display:flex;align-items:center;gap:10px;margin-bottom:2px}
.ddot{width:8px;height:8px;border-radius:50%}.dhdr h2{font-size:20px;font-weight:600;color:#fff}
.dfoc{font-size:13px;color:#d4d4d4;margin-left:18px}
/* Warmup */
.wu-section{padding:16px 20px;border-bottom:1px solid #2a2a2a}
.wu-title{font-size:14px;font-weight:600;color:#fbbf24;margin-bottom:4px}
.wu-note{font-size:12px;color:#888;margin-bottom:10px}
.wu-row{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid #1e1e1e}
.wu-row:first-of-type{border-top:none}
.wu-name{font-size:14px;color:#d4d4d4;flex:1}
.wu-reps{font-size:12px;color:#888}
.wu-ck{width:24px;height:24px;border-radius:5px;border:2px solid #444;background:transparent;color:transparent;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.wu-ck.on{border:none;background:#fbbf24;color:#000}
/* Exercise */
.ex{padding:16px 20px;border-bottom:1px solid #2a2a2a;transition:opacity .3s}.ex.alldone{opacity:.35}
.ex-hdr{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.en{font-size:16px;font-weight:600;color:#fff}.ex.alldone .en{text-decoration:line-through;color:#666}
.bdg{font-size:10px;font-weight:700;padding:3px 7px;border-radius:4px;text-transform:uppercase}
.bdg-safe{background:#14332a;color:#4ade80}
.sdone{font-size:11px;color:#888;font-weight:600}
.skip-btn{margin-left:auto;padding:4px 10px;border-radius:5px;border:1px solid #333;background:transparent;color:#666;font-size:10px;font-weight:600;cursor:pointer;font-family:inherit;text-transform:uppercase}
.skip-btn:active{background:#331414;color:#ef4444}
.ex-skipped{padding:12px 20px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #2a2a2a}
.ex-skipped-name{font-size:14px;color:#555;text-decoration:line-through}
.ex-skipped-label{font-size:11px;color:#ef4444;font-weight:600;margin-left:8px}
.ex-skipped-undo{padding:6px 12px;border-radius:6px;border:1px solid #444;background:transparent;color:#888;font-size:11px;font-weight:600;cursor:pointer;font-family:inherit}
.em{display:flex;gap:14px;font-size:13px;color:#d4d4d4;flex-wrap:wrap}.em .dt{color:#555}
.eno{font-size:13px;color:#b0b0b0;margin:8px 0 0}
/* Superset bracket */
.ss-group{margin:0 20px;border-left:3px solid #c4956a;padding-left:0;margin-bottom:2px}
.ss-label{font-size:10px;color:#c4956a;text-transform:uppercase;font-weight:600;letter-spacing:.5px;padding:8px 0 4px 16px}
.ss-group .ex{padding:12px 16px;border-bottom:1px solid #1e1e1e;margin:0}
.ss-group .ex:last-child{border-bottom:none}
/* Set cards */
.scard{background:#1a1a1a;border-radius:10px;border:1px solid #2a2a2a;padding:10px 12px;margin-top:8px;transition:all .2s}.scard:first-of-type{margin-top:12px}.scard.done{background:#111;border-color:#333;opacity:.5}
.scard-top{display:flex;align-items:center;margin-bottom:8px}
.slbl{font-size:12px;color:#d4d4d4;font-weight:700;min-width:38px}.scard.done .slbl{color:#666}
.slast{font-size:10px;color:#555;margin-left:auto;margin-right:8px}
.ck{width:28px;height:28px;border-radius:6px;border:2px solid #555;background:transparent;color:#555;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all .2s}
.ck.on{border:none;background:var(--ac,#E85D3A);color:#fff}
.srow-line{display:flex;align-items:center;gap:8px;padding:8px 0;border-top:1px solid #252525}
.srow-label{font-size:10px;color:#888;min-width:42px;text-transform:uppercase;font-weight:600}
.wbtn{width:36px;height:36px;border-radius:8px;border:1px solid #444;background:#222;color:#fff;font-size:20px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;font-family:inherit;user-select:none}
.wbtn:active{background:#333;transform:scale(.95)}.scard.done .wbtn{opacity:.4;pointer-events:none}
.wval{flex:1;text-align:center;font-size:16px;font-weight:700;color:var(--ac,#E85D3A)}.scard.done .wval{color:#666}
.rbtn{width:36px;height:36px;border-radius:8px;border:1px solid #3a3a3a;background:#151515;color:#d4d4d4;font-size:18px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;font-family:inherit;user-select:none}
.rbtn:active{background:#2a2a2a;transform:scale(.95)}.scard.done .rbtn{opacity:.4;pointer-events:none}
.rval{flex:1;text-align:center;font-size:16px;font-weight:600;color:#d4d4d4}.scard.done .rval{color:#666}
.sreps-only{font-size:13px;color:#888;padding:6px 0;border-top:1px solid #252525;text-align:center}
/* Stretch */
.str-section{padding:16px 20px;border-bottom:1px solid #2a2a2a}
.str-title{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.str-row{display:flex;align-items:center;gap:8px;padding:8px 10px;background:#1a1a1a;border-radius:8px;border:1px solid #2a2a2a;margin-bottom:6px}
.str-name{font-size:14px;color:#d4d4d4;font-weight:500;flex:1}
.str-hold{padding:7px 16px;border-radius:7px;border:1.5px solid #60a5fa;background:transparent;color:#60a5fa;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit;display:flex;align-items:center;gap:5px}
.str-hold:active{background:#1a2a3a}
.str-x{width:24px;height:24px;border-radius:6px;border:none;background:transparent;color:#555;font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.str-add{padding:10px;border-radius:8px;border:1px dashed #333;background:transparent;color:#888;font-size:13px;font-weight:500;cursor:pointer;width:100%;text-align:center;font-family:inherit;margin-top:4px}.str-add:active{background:#1a1a1a}
/* Progress etc */
.prg{padding:16px 20px}
.prg-h{display:flex;justify-content:space-between;margin-bottom:6px;font-size:12px;color:#b0b0b0;text-transform:uppercase;font-weight:600}
.prg-t{height:4px;background:#2a2a2a;border-radius:2px;overflow:hidden}.prg-f{height:100%;border-radius:2px;transition:width .4s}
.logs{padding:12px 20px}
.lbtn{width:100%;padding:16px;border-radius:12px;border:none;font-size:14px;font-weight:700;text-transform:uppercase;cursor:pointer;font-family:inherit}
.lbtn.rdy{background:#4ade80;color:#000}.lbtn.rdy:active{transform:scale(.98)}.lbtn.off{background:#1a1a1a;color:#666;cursor:default}.lbtn.lgd{background:#14332a;color:#4ade80}
.ftr{padding:16px 20px 32px;text-align:center;font-size:13px;color:#b0b0b0;border-top:1px solid #2a2a2a}
.vw{display:none}.vw.on{display:block}
/* Modals */
.modal{position:fixed;top:0;left:0;right:0;bottom:0;z-index:1000;display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:40px 20px}.modal.on{display:flex}
.modal-rest{background:rgba(0,0,0,.92)}.modal-hold{background:rgba(5,20,40,.95)}
.modal-label{font-size:13px;text-transform:uppercase;letter-spacing:1px;font-weight:600;margin-bottom:6px}
.modal-exname{font-size:18px;color:#d4d4d4;margin-bottom:28px}
.modal-circle{width:170px;height:170px;border-radius:50%;display:flex;align-items:center;justify-content:center;margin-bottom:8px}
.modal-digits{font-size:52px;font-weight:700;font-variant-numeric:tabular-nums}
.modal-sub{font-size:13px;margin-bottom:24px}
.modal-bar{width:100%;max-width:240px;height:4px;border-radius:2px;overflow:hidden;margin-bottom:28px}.modal-bar-fill{height:100%;border-radius:2px;transition:width .25s linear}
.modal-stop{width:200px;padding:16px;border-radius:12px;border:2px solid #ef4444;background:transparent;color:#ef4444;font-size:18px;font-weight:700;text-transform:uppercase;letter-spacing:1px;cursor:pointer;font-family:inherit}
.modal-stop:active{background:#ef4444;color:#fff;transform:scale(.97)}
/* History + Nutrition styles same as before - kept compact */
.hwrap{padding:0 20px 24px}
.h-card{background:#171717;border:1px solid #2a2a2a;border-radius:12px;padding:16px;margin-top:16px}
.h-bw-row{display:flex;justify-content:space-between;align-items:center;padding-bottom:14px;margin-bottom:14px;border-bottom:1px solid #2a2a2a}
.h-bw-left div:first-child{font-size:10px;color:#888;text-transform:uppercase;font-weight:600}
.h-bw-val{font-size:24px;font-weight:700;color:#fff}.h-bw-unit{font-size:14px;color:#888}
.h-bw-input{display:flex;align-items:center;gap:6px}
.h-bw-inp{width:60px;padding:8px;border-radius:6px;border:1px solid #2a2a2a;background:#1a1a1a;color:#fff;font-size:14px;text-align:center;font-family:inherit}.h-bw-inp::placeholder{color:#555}
.h-bw-btn{padding:8px 12px;border-radius:6px;border:1px solid #4ade80;background:transparent;color:#4ade80;font-size:12px;font-weight:600;cursor:pointer;font-family:inherit}.h-bw-btn:active{background:#4ade80;color:#000}
.h-bw-msg{font-size:11px;margin-top:4px;min-height:14px;font-weight:600;text-align:right}
.h-stats{display:flex;gap:12px;margin-bottom:14px}
.h-stat{flex:1;background:#1a1a1a;border-radius:8px;padding:12px;text-align:center}
.h-stat-val{font-size:28px;font-weight:700;color:#fff}.h-stat-lbl{font-size:11px;color:#888}
.h-recent-title{font-size:10px;color:#888;text-transform:uppercase;font-weight:600;margin-bottom:8px}
.h-recent-row{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #1e1e1e}.h-recent-row:last-child{border-bottom:none}
.h-recent-name{font-size:14px;font-weight:600}.h-recent-date{font-size:12px;color:#888}
.h-sheet-link{text-align:center;margin-top:12px;font-size:12px;color:#555}
.stg{padding:20px 0;border-top:1px solid #2a2a2a;margin-top:14px}
.stg-t{font-size:12px;color:#b0b0b0;text-transform:uppercase;letter-spacing:1px;font-weight:700;margin-bottom:10px}
.tinp{background:#1a1a1a;border:1px solid #2a2a2a;border-radius:8px;padding:10px 12px;font-size:13px;color:#fff;width:100%;box-sizing:border-box;font-family:inherit}.tinp::placeholder{color:#666}
.sbtn{padding:10px 18px;border-radius:8px;background:transparent;font-size:12px;font-weight:600;cursor:pointer;text-transform:uppercase;letter-spacing:.5px;font-family:inherit}
.stmsg{font-size:13px;font-weight:600;margin-top:8px;min-height:18px}
/* Nutrition */
.n-wrap{padding:0 16px 24px}
.nc{background:#141414;border:1px solid #1e1e1e;border-radius:14px;padding:18px 16px;margin-bottom:10px}
.n-sec{font-size:11px;color:#7a7570;text-transform:uppercase;letter-spacing:1px;font-weight:600;margin:18px 0 8px 4px}
.n-pick{padding:6px 14px;border-radius:6px;border:1px solid #c4956a;background:transparent;color:#c4956a;font-size:12px;font-weight:600;cursor:pointer;font-family:inherit}
.n-clear{padding:4px 10px;border-radius:5px;border:1px solid #1e1e1e;background:transparent;color:#7a7570;font-size:10px;cursor:pointer;font-family:inherit}
.n-idea{padding:12px 0;border-top:1px solid #1e1e1e;cursor:pointer}.n-idea:first-child{border-top:none}.n-idea:active{background:#1a1a1a}
.n-custom input{background:#1a1a1a;border:1px solid #2a2a2a;border-radius:6px;padding:8px;font-size:13px;color:#fff;font-family:inherit;text-align:center}
.n-drink-btn{padding:6px 12px;border-radius:6px;border:1px solid #1e1e1e;background:#1a1a1a;color:#e8e4df;font-size:12px;cursor:pointer;font-family:inherit}
.n-drink-rm{width:22px;height:22px;border-radius:4px;border:1px solid #1e1e1e;background:transparent;color:#d4695a;font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.toast{position:fixed;bottom:30px;left:50%;transform:translateX(-50%) translateY(80px);background:#2a2a2a;color:#fff;font-size:14px;font-weight:600;padding:14px 24px;border-radius:12px;border-left:4px solid #4ade80;z-index:999;transition:transform .35s ease,opacity .35s;opacity:0;pointer-events:none;box-shadow:0 4px 24px rgba(0,0,0,.6)}.toast.show{transform:translateX(-50%) translateY(0);opacity:1}
</style>
</head>
<body style="background:#0c0c0c !important;">
<div class="app">
<div class="hdr"><h1>Your Routine</h1><div class="tg">TRAINER PROGRAM · KB & BW · ELBOW REHAB</div><p class="sb">Day 1 / Day 2 · Supersets · Train smart</p></div>
<div class="sync-bar ok" id="syncBar"></div>
<div class="mbar"><button class="mbtn on" id="bW" onclick="md('w')">Workout</button><button class="mbtn" id="bN" onclick="md('n')">Nutrition</button><button class="mbtn" id="bH" onclick="md('h')">History</button></div>
<div class="vw on" id="vW"><div class="pkr" id="pkr"></div><div class="dhdr" id="dhdr"></div><div id="wuSection"></div><div id="exL"></div><div id="strSection"></div><div class="prg" id="prg"></div><div class="logs"><button class="lbtn off" id="lBtn" onclick="doLog()">Complete sets to log</button></div>
<div class="ftr">Walk 30-45 min daily · Munchies: almonds + fruit</div></div>
<div class="vw" id="vN"><div class="n-wrap" id="nWrap"></div></div>
<div class="vw" id="vH"><div class="hwrap" id="hWrap"></div></div>
</div>
<div class="modal modal-rest" id="restModal"><div class="modal-label" style="color:#b0b0b0">Rest</div><div class="modal-exname" id="restEx"></div><div class="modal-circle" style="border:4px solid #2a2a2a"><div class="modal-digits" id="restDigits" style="color:#fff">0</div></div><div class="modal-sub" style="color:#888" id="restSub"></div><div class="modal-bar" style="background:#2a2a2a"><div class="modal-bar-fill" id="restFill"></div></div><button class="modal-stop" onclick="stopRest()">Stop</button></div>
<div class="modal modal-hold" id="holdModal"><div class="modal-label" id="holdLabel" style="color:#60a5fa">Hold</div><div class="modal-exname" id="holdEx"></div><div class="modal-circle" id="holdCircle" style="border:4px solid #1e3a5a"><div class="modal-digits" id="holdDigits" style="color:#fff">0:00</div></div><div class="modal-sub" id="holdSub" style="color:#888">Target: 30s</div><div class="modal-bar" id="holdBarWrap" style="background:#1e3a5a"><div class="modal-bar-fill" id="holdFill" style="background:#60a5fa"></div></div><button class="modal-stop" onclick="stopHold()">Stop</button></div>
<div class="toast" id="toast"></div>
<script>
// ══ WARMUP (shared, Day 2 adds Birddogs) ══
var WU_BASE=["Stretch Machine","Leg Crossovers","Scapula Shrugs","T-Spine Openers","TRX Hip Flexor Stretch"];
var WU_DAY2=WU_BASE.concat(["Birddogs"]);

// ══ SESSIONS — Trainer's KB/BW Program ══
// ss: superset group (exercises with same ss# are paired)
// unit: "kg","lbs","BW"; step: increment for +/- buttons
// repLabel: displayed as-is when reps are non-numeric
var SS=[
{id:"day1",label:"Day 1",focus:"KB Swings · Core · Stability",color:"#E85D3A",warmup:WU_BASE,exercises:[
{name:"Swiss Ball Deadbugs",sets:2,reps:6,base:0,step:0,min:0,max:0,rest:45,unit:"BW",repLabel:"6 ea. side",notes:"Back pressed into ball. Controlled."},
{name:"KB Swings",sets:4,reps:12,base:16,step:2,min:8,max:32,rest:60,unit:"kg",notes:"Hip hinge. Power from glutes."},
{name:"Tempo KB Suitcase Deadlift",sets:3,reps:8,base:16,step:2,min:8,max:32,rest:0,unit:"kg",notes:"Slow tempo. Brace core.",ss:1},
{name:"KB Suitcase March",sets:3,reps:6,base:16,step:2,min:8,max:32,rest:60,unit:"kg",repLabel:"6 ea. leg/ea. hand",notes:"Hold KB at side. March with control.",ss:1},
{name:"KB Halo",sets:3,reps:10,base:10,step:2,min:6,max:20,rest:0,unit:"kg",repLabel:"8-12 ea. side",notes:"Circle KB around head. Tight core.",ss:2},
{name:"Bear Plank",sets:4,reps:0,base:0,step:0,min:0,max:0,rest:60,unit:"BW",repLabel:"2 min total",notes:"Knees 1 inch off floor. Hold steady.",ss:2}
]},
{id:"day2",label:"Day 2",focus:"KB · TRX · Anti-Rotation",color:"#2E86AB",warmup:WU_DAY2,exercises:[
{name:"KB Swings",sets:4,reps:12,base:16,step:2,min:8,max:32,rest:60,unit:"kg",notes:"Hip hinge. Power from glutes."},
{name:"TRX Lateral Bends",sets:3,reps:8,base:0,step:0,min:0,max:0,rest:45,unit:"BW",repLabel:"8 ea. side",notes:"Side bend on TRX. Core engagement."},
{name:"Suitcase March",sets:3,reps:6,base:16,step:2,min:8,max:32,rest:0,unit:"kg",repLabel:"6 ea. leg/ea. side",notes:"Hold KB at side. Controlled march.",ss:1},
{name:"Half Kneeling KB Q Press",sets:3,reps:8,base:10,step:2,min:6,max:20,rest:60,unit:"kg",repLabel:"8 ea. side",notes:"Half kneel. Press at an angle. Anti-rotation.",ss:1},
{name:"Pallof Press Walk",sets:4,reps:4,base:10,step:2.5,min:5,max:30,rest:0,unit:"lbs",repLabel:"4 steps out, 4 in ea. side",notes:"Cable anti-rotation. Walk out and back.",ss:2},
{name:"Goodmornings",sets:4,reps:12,base:0,step:0,min:0,max:0,rest:60,unit:"BW",notes:"Hinge at hips. Feel hamstrings stretch.",ss:2}
]}
];

// ══ NUTRITION DATA (same as before) ══

h+='<div class="n-sec">Meals</div>';h+=nMS("m1","Meal 1","Late morning / early afternoon",nMeal1,MI.m1.concat(MI.out),"nMeal1");h+=nMS("pw","Pre-Workout Snack","Before workout",nPW,MI.pw,"nPW");h+=nMS("m2","Meal 2","Post-workout",nMeal2,MI.m2.concat(MI.out),"nMeal2");
h+='<div class="n-sec">Alcohol</div><div class="nc"><div style="display:flex;justify-content:space-between;align-items:center;'+(nDrinkOn?"margin-bottom:12px":"")+'"><div style="font-size:14px;font-weight:600;color:#e8e4df">Drinking tonight?</div><button onclick="nDrinkOn=!nDrinkOn;if(!nDrinkOn)nDrinks=[];rNut();" style="padding:6px 14px;border-radius:6px;border:1px solid '+(nDrinkOn?"#d4695a":"#1e1e1e")+';background:'+(nDrinkOn?"rgba(212,105,90,.1)":"transparent")+';color:'+(nDrinkOn?"#d4695a":"#7a7570")+';font-size:12px;font-weight:600;cursor:pointer;font-family:inherit">'+(nDrinkOn?"Yes":"No")+'</button></div>';
if(nDrinkOn){h+='<div style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px">';for(var dk in DRK)h+='<button class="n-drink-btn" onclick="nAD(\''+dk+'\')">+ '+DRK[dk].l+'</button>';h+='</div>';nDrinks.forEach(function(d){h+='<div style="display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-top:1px solid #1e1e1e"><span style="font-size:13px;color:#e8e4df">'+DRK[d.t].l+' \u00d7 '+d.q+'</span><div style="display:flex;align-items:center;gap:8px"><span style="font-size:12px;color:#7a7570">'+DRK[d.t].c*d.q+' cal</span><button class="n-drink-rm" onclick="nRD(\''+d.t+'\')">\u2212</button></div></div>';});if(dc>0)h+='<div style="font-size:12px;color:#c4956a;margin-top:10px;padding:10px 0;border-top:1px solid #1e1e1e">'+dc+' cal from drinks.'+(dc>300?" Cut a meal portion.":"")+'</div>';}
h+='</div>';
h+='<div class="n-sec">Hydration</div><div class="nc"><div style="display:flex;gap:16px"><div style="flex:1"><div style="font-size:13px;font-weight:600;color:#e8e4df">Daily: 100oz+</div><div style="font-size:12px;color:#7a7570">~12 glasses</div></div><div style="width:1px;background:#1e1e1e"></div><div style="flex:1"><div style="font-size:13px;font-weight:600;color:#e8e4df">Pre-workout: 16oz</div><div style="font-size:12px;color:#7a7570">1 hour before</div></div></div></div>';
document.getElementById("nWrap").innerHTML=h;}

function nMS(id,label,time,meal,ideas,vn){var h='<div class="nc"><div style="display:flex;justify-content:space-between;align-items:center"><div><div style="font-size:10px;color:#7a7570;text-transform:uppercase;font-weight:600">'+label+'</div><div style="font-size:12px;color:#7a7570;margin-top:2px">'+time+'</div></div>';
if(meal)h+='<button class="n-clear" onclick="'+vn+'=null;nShow.'+id+'=false;rNut()">Clear</button>';else h+='<button class="n-pick" onclick="nShow.'+id+'=!nShow.'+id+';rNut()">'+(nShow[id]?"Close":"Pick")+'</button>';h+='</div>';
if(meal){h+='<div style="margin-top:10px"><div style="font-size:15px;font-weight:600;color:#e8e4df;margin-bottom:4px">'+meal.n+'</div>';if(meal.note)h+='<div style="font-size:11px;color:#c4956a;margin-bottom:6px">'+meal.note+'</div>';h+='<div style="display:flex;gap:12px;font-size:12px"><span style="color:#c4956a;font-weight:600">'+meal.c+' cal</span><span style="color:#6abf8a">'+meal.p+'g P</span><span style="color:#6a9bc4">'+meal.cr+'g C</span><span style="color:#9b7cc4">'+meal.f+'g F</span></div></div>';}
if(nShow[id]&&!meal){h+='<div style="margin-top:10px">';ideas.forEach(function(idea){h+='<div class="n-idea" onclick="'+vn+'={n:\''+idea.n.replace(/'/g,"\\'")+'\',c:'+idea.c+',p:'+idea.p+',cr:'+idea.cr+',f:'+idea.f+(idea.note?',note:\''+idea.note.replace(/'/g,"\\'")+'\'':'')+'}; nShow.'+id+'=false;rNut()"><div style="font-size:14px;font-weight:500;color:#e8e4df;margin-bottom:2px">'+idea.n+'</div>';if(idea.note)h+='<div style="font-size:11px;color:#c4956a;margin-bottom:4px">'+idea.note+'</div>';h+='<div style="display:flex;gap:10px;font-size:11px;color:#7a7570"><span>'+idea.c+' cal</span><span>'+idea.p+'g P</span><span>'+idea.cr+'g C</span><span>'+idea.f+'g F</span></div></div>';});
h+='<div style="padding:12px 0;border-top:1px solid #1e1e1e"><div style="font-size:12px;color:#7a7570;margin-bottom:8px">Custom:</div><div style="display:flex;flex-wrap:wrap;gap:6px;align-items:center"><input id="cn-'+id+'" placeholder="Name" class="n-custom" style="flex:2;min-width:80px"><input id="cc-'+id+'" placeholder="Cal" type="number" class="n-custom" style="width:50px"><input id="cp-'+id+'" placeholder="Prot" type="number" class="n-custom" style="width:50px"><button style="padding:8px 14px;border-radius:6px;border:1px solid #4ade80;background:transparent;color:#4ade80;font-size:12px;font-weight:600;cursor:pointer;font-family:inherit" onclick="nCust(\''+id+'\',\''+vn+'\')">Add</button></div></div></div>';}
h+='</div>';return h;}

function nCust(id,vn){var n=document.getElementById("cn-"+id).value||"Custom";var c=parseInt(document.getElementById("cc-"+id).value)||0;var p=parseInt(document.getElementById("cp-"+id).value)||0;if(c<=0){toast("Enter calories");return;}eval(vn+"={n:'"+n.replace(/'/g,"\\'")+"',c:"+c+",p:"+p+",cr:0,f:0}");nShow[id]=false;rNut();}
function nAD(t){var ex=nDrinks.find(function(d){return d.t===t;});if(ex)ex.q++;else nDrinks.push({t:t,q:1});rNut();}
function nRD(t){nDrinks=nDrinks.map(function(d){return d.t===t?{t:d.t,q:d.q-1}:d;}).filter(function(d){return d.q>0;});rNut();}

// ══ HISTORY ══
function rHist(){var el=document.getElementById("hWrap"),h="";h+='<div class="h-card"><div class="h-bw-row"><div class="h-bw-left">';if(bodyWts.length>0){var first=bodyWts[0],last=bodyWts[bodyWts.length-1];var diff=Math.round((last.weight-first.weight)*10)/10;var cls=diff<0?"color:#4ade80":diff>0?"color:#ef4444":"color:#888";var sign=diff>0?"+":"";h+='<div>Body Weight</div><div class="h-bw-val">'+last.weight+' <span class="h-bw-unit">lbs</span></div></div><div style="text-align:right"><div style="font-size:14px;font-weight:700;'+cls+'">'+sign+diff+' lbs</div><div style="font-size:11px;color:#888">since start</div></div>';}else{h+='<div>Body Weight</div><div style="font-size:14px;color:#888">Not logged yet</div></div><div></div>';}h+='<div class="h-bw-input"><input type="number" class="h-bw-inp" id="bwInput" placeholder="lbs" step="0.1" inputmode="decimal"><button class="h-bw-btn" onclick="logBW()">Log</button></div></div><div class="h-bw-msg" id="bwMsg"></div>';var now=new Date(),ws=new Date(now);ws.setDate(now.getDate()-now.getDay());var wStr=ws.toISOString().substring(0,10);var wd={};cloudHist.forEach(function(ch){var cd=ch.date.substring(0,10);if(cd>=wStr)wd[cd]=true;});var wc=Object.keys(wd).length;h+='<div class="h-stats"><div class="h-stat"><div class="h-stat-val">'+wc+'</div><div class="h-stat-lbl">this week</div></div><div class="h-stat"><div class="h-stat-val">'+cloudHist.length+'</div><div class="h-stat-lbl">total sessions</div></div></div>';if(cloudHist.length>0){h+='<div class="h-recent-title">Recent</div>';var recent=cloudHist.slice(-6).reverse();for(var i=0;i<recent.length;i++){var s2=recent[i],color="#888";for(var si=0;si<SS.length;si++)if(SS[si].label===s2.sl){color=SS[si].color;break;}h+='<div class="h-recent-row"><span class="h-recent-name" style="color:'+color+'">'+s2.sl+'</span><span class="h-recent-date">'+fmtDate(s2.date)+'</span></div>';}}h+='<div class="h-sheet-link">Full details in Google Sheet</div></div>';h+=gSH();el.innerHTML=h;var whI=document.getElementById("whIn");if(whI)whI.value=getWh();}
async function logBW(){var input=document.getElementById("bwInput");var val=parseFloat(input.value);var msg=document.getElementById("bwMsg");if(!val||val<50||val>500){msg.textContent="Enter valid weight";msg.style.color="#ef4444";return;}var td=new Date().toISOString().substring(0,10);var url=getWh();if(!url){msg.textContent="Set up sync first";msg.style.color="#ef4444";return;}msg.textContent="Logging...";msg.style.color="#b0b0b0";try{await fetch(url,{method:"POST",mode:"no-cors",headers:{"Content-Type":"application/json"},body:JSON.stringify({type:"bodyweight",date:td,weight:val})});var ex=bodyWts.findIndex(function(b){return b.date===td;});if(ex>=0)bodyWts[ex].weight=val;else bodyWts.push({date:td,weight:val});input.value="";msg.textContent="\u2713 "+val+" lbs";msg.style.color="#4ade80";setTimeout(function(){msg.textContent="";R();},1500);}catch(e){msg.textContent="Failed";msg.style.color="#ef4444";}}
function gSH(){return '<div class="stg"><div class="stg-t">Google Sheets Sync</div><p style="font-size:13px;color:#d4d4d4;margin-bottom:12px">Your data source.</p><input class="tinp" id="whIn" placeholder="https://script.google.com/macros/s/..." value="'+getWh()+'"><div style="display:flex;gap:8px;margin-top:10px"><button class="sbtn" style="border:1px solid #4ade80;color:#4ade80" onclick="svWh()">Save &amp; Sync</button><button class="sbtn" style="border:1px solid #888;color:#888" onclick="tstWh()">Test</button></div><div class="stmsg" id="whSt"></div></div><div style="padding-top:14px"><button class="sbtn" style="border:1px solid #888;color:#888" onclick="expCSV()">Export CSV</button></div>';}

// ══ ACTIONS ══
function pk(i){act=i;skipped={};svLocal();R();}
function tgWU(i){var k="wu-"+act+"-"+i;wuDone[k]=!wuDone[k];svLocal();rWU();}
function tgSet(si,ei,sti){var k=si+"-"+ei+"-"+sti;if(setD[k]){delete setD[k];}else{setD[k]=true;var ex=SS[si].exercises[ei];if(ex.rest>0&&sti<ex.sets-1)startRest(ex.rest,ex.name);}svLocal();R();}
function aw(si,ei,sti,dir){var ex=SS[si].exercises[ei],k=si+"-"+ei+"-"+sti;var nv=wts[k]+(ex.step*dir);if(nv<ex.min)nv=ex.min;if(nv>ex.max)nv=ex.max;wts[k]=nv;var el=document.getElementById("wv-"+k);if(el)el.textContent=nv+" "+ex.unit;svLocal();}
function ar(si,ei,sti,dir){var k=si+"-"+ei+"-"+sti;var nv=rps[k]+dir;if(nv<0)nv=0;if(nv>99)nv=99;rps[k]=nv;var el=document.getElementById("rv-"+k);if(el)el.textContent=nv;svLocal();}
function addStr(){if(!strs[act])strs[act]=[];if(!scnt[act])scnt[act]=0;scnt[act]++;strs[act].push(scnt[act]);svLocal();rStr();}
function rmStr(i){if(strs[act].length<=1)return;strs[act].splice(i,1);svLocal();rStr();}

async function doLog(){var s=SS[act],td=new Date().toISOString().substring(0,10);var rows=[];for(var i=0;i<s.exercises.length;i++){if(skipped[act+"-"+i])continue;var ex=s.exercises[i];for(var sti=0;sti<ex.sets;sti++){var sk=act+"-"+i+"-"+sti;rows.push({date:td,day:s.label,exercise:ex.name,set:sti+1,reps:rps[sk]||ex.repLabel||"",weight:wts[sk]||0,unit:ex.unit,completed:!!setD[sk]});}}var strN=strs[act]?strs[act].length:0;if(strN>0)rows.push({date:td,day:s.label,exercise:"Stretching",set:strN,reps:"-",weight:0,unit:"-",completed:true});s.exercises.forEach(function(ex,ei){for(var sti=0;sti<ex.sets;sti++)delete setD[act+"-"+ei+"-"+sti];});var wu=SS[act].warmup||WU_BASE;wu.forEach(function(_,i){delete wuDone["wu-"+act+"-"+i];});strs[act]=[1];scnt[act]=1;skipped={};var nx=(act+1)%SS.length;act=nx;stopRest();stopHold();svLocal();toast("Logging...");var url=getWh();if(url){try{await fetch(url,{method:"POST",mode:"no-cors",headers:{"Content-Type":"application/json"},body:JSON.stringify({rows:rows})});setTimeout(async function(){await fetchHistory();R();toast("Logged! Next: "+SS[nx].label);},2000);}catch(e){toast("Saved locally.");}}else{toast("No sync URL.");}R();}

function svWh(){var u=(document.getElementById("whIn")||{}).value||"";setWhUrl(u);var s=document.getElementById("whSt");s.textContent="Syncing...";s.style.color="#b0b0b0";fetchHistory().then(function(){s.textContent=u?"\u2713 Synced":"Cleared";s.style.color="#4ade80";R();setTimeout(function(){s.textContent="";},2000);});}
function tstWh(){var u=(document.getElementById("whIn")||{}).value||"",s=document.getElementById("whSt");if(!u){s.textContent="\u2717 Enter URL";s.style.color="#ef4444";return;}s.textContent="Testing...";s.style.color="#b0b0b0";fetch(u,{method:"POST",mode:"no-cors",headers:{"Content-Type":"application/json"},body:JSON.stringify({rows:[{date:"TEST",day:"Test",exercise:"Test",set:1,reps:"0",weight:0,unit:"-",completed:true}]})}).then(function(){s.textContent="\u2713 Sent";s.style.color="#4ade80";}).catch(function(){s.textContent="\u2717 Failed";s.style.color="#ef4444";});setTimeout(function(){s.textContent="";},3000);}
function expCSV(){if(!cloudHist.length){toast("No history");return;}var csv="Date,Session,Exercise,Set,Reps,Weight,Unit,Completed\n";cloudHist.forEach(function(h){h.ex.forEach(function(x){x.sets.forEach(function(s){csv+=h.date.substring(0,10)+',"'+h.sl+'","'+x.n+'",'+s.set+',"'+s.reps+'",'+s.w+',"'+(s.u||"")+'",'+(s.c)+"\n";});});});var a=document.createElement("a");a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv"}));a.download="workout.csv";a.click();toast("CSV downloaded");}

ldLocal();initWR();R();fetchHistory().then(function(){if(!anyD()){act=nxS();svLocal();}R();});
</script>
